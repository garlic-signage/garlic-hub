<IfModule !mod_dav.c>
    LoadModule dav_module /usr/lib/apache2/modules/mod_dav.so
</IfModule>
<IfModule !mod_dav_fs.c>
    LoadModule dav_fs_module /usr/lib/apache2/modules/mod_dav_fs.so
</IfModule>

Alias /device-logs /var/www/html/var/devicelogs

<Directory "/var/www/html/var/devicelogs">
    DAV On
    Options Indexes
    AllowOverride None
    # maximal 20MB
    LimitRequestBody 20971520

    <RequireAny>
        # only for developing
        Require method GET
        <RequireAll>
            Require method PUT
            Require expr "%{REQUEST_URI} =~ m#\.xml$#"
        </RequireAll>
    </RequireAny>
</Directory>