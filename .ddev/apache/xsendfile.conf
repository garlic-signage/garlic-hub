<IfModule !mod_xsendfile.c>
    LoadModule xsendfile_module /usr/lib/apache2/modules/mod_xsendfile.so
</IfModule>

# delivery.php hands player downloads to Apache instead of streaming them through PHP
<IfModule mod_xsendfile.c>
    XSendFile On
    XSendFilePath /var/www/html/var/storage/mediapool/originals
    SetEnv GARLIC_XSENDFILE 1
</IfModule>
