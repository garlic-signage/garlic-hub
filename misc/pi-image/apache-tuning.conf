# Apache with mpm_event, PHP runs in PHP-FPM. A download which delivery.php hands over with X-Sendfile
# keeps only a thread, not a PHP process: 200 players may download at the same time.
<IfModule mpm_event_module>
    StartServers            2
    ServerLimit             12
    ThreadsPerChild         25
    MaxRequestWorkers       300
    MinSpareThreads         25
    MaxSpareThreads         75
    MaxConnectionsPerChild  0
</IfModule>

KeepAliveTimeout 5

# an upload with its thumbnails may take as long as max_execution_time of PHP
ProxyTimeout 1200
