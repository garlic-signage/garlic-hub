// garlic-hub: updates install themselves, the Pi is an appliance without its own IT.
// Installed by build.sh as /etc/apt/apt.conf.d/52garlic-hub-unattended-upgrades, after the defaults of Debian
// in 50unattended-upgrades (Debian, Debian-Security), which stay as they are.

// daily: update the package lists, install the updates
APT::Periodic::Update-Package-Lists "1";
APT::Periodic::Unattended-Upgrade "1";
APT::Periodic::AutocleanInterval "7";

// kernel and firmware come from the archive of Raspberry Pi, it has no security suite of its own
Unattended-Upgrade::Origins-Pattern {
	"origin=Raspberry Pi Foundation,codename=${distro_codename},label=Raspberry Pi Foundation,component=main";
};

// restart only when an update needs it (/var/run/reboot-required, e.g. kernel or libc), then at 3 at night
Unattended-Upgrade::Automatic-Reboot "true";
Unattended-Upgrade::Automatic-Reboot-WithUsers "true";
Unattended-Upgrade::Automatic-Reboot-Time "03:00";
Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
Unattended-Upgrade::Remove-Unused-Dependencies "true";

// the own policy.xml of ImageMagick is a changed conffile: without these options its security updates would be
// held back. Keep the own files, take the new defaults where nothing was changed.
Dpkg::Options {
	"--force-confdef";
	"--force-confold";
};
