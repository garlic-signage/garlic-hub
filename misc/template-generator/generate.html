<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<title>Template generator</title>
	<script src="../../public/js/external/fabric.min.js"></script>
	<script src="templates.js"></script>
</head>
<body>
<pre id="out"></pre>
<script>
	'use strict';

	// the same properties as TemplateFabricWrapper.toTemplateJSON()
	const PROPERTIES = ["mediaId", "fileName", "placeholder", "lockMovementX", "lockMovementY", "lockRotation", "lockScalingX", "lockScalingY"];
	const FORMATS    = [['landscape', 1920, 1080], ['portrait', 1080, 1920]];
	// like the composer, see TemplateFabricWrapper.js
	fabric.Object.NUM_FRACTION_DIGITS = 6;

	async function loadFonts()
	{
		for (const [name, path] of Object.entries(FONTS))
		{
			const fontFace = new FontFace(name, 'url(../../public/fonts/' + path + ')');
			await fontFace.load();
			document.fonts.add(fontFace);
		}
	}

	// the image is rendered from the loaded JSON, so the JSON is checked the way the composer loads it
	async function renderImage(json, width, height)
	{
		const canvas = new fabric.StaticCanvas(null, {width: width, height: height});
		await new Promise(resolve => canvas.loadFromJSON(JSON.stringify(json), resolve));
		canvas.backgroundColor = '#ffffff';
		return canvas.toDataURL({format: 'jpeg', quality: 0.9});
	}

	async function loadPlaceholder()
	{
		placeholderElement = await new Promise((resolve, reject) =>
		{
			const image   = new Image();
			image.onload  = () => resolve(image);
			image.onerror = () => reject(new Error('placeholder not loaded: ' + image.src));
			image.src     = '../../public' + PLACEHOLDER_SRC;
		});
	}

	// the composer gets the picture of a placeholder from the server, not the path of the generator
	function setPlaceholderSrc(objects)
	{
		for (const object of objects)
		{
			if (object.placeholder === true)
				object.src = PLACEHOLDER_SRC;
			if (Array.isArray(object.objects))
				setPlaceholderSrc(object.objects);
		}
	}

	async function generate()
	{
		await loadFonts();
		await loadPlaceholder();
		const result = [];
		for (const template of TEMPLATES)
		{
			for (const [orientation, width, height] of FORMATS)
			{
				const canvas = new fabric.StaticCanvas(null, {width: width, height: height});
				template.build(width, height).forEach(object => canvas.add(object));

				const json    = canvas.toJSON(PROPERTIES);
				json.viewport = {width: width, height: height, scale: 100};

				result.push({
					key: template.key + '_' + orientation,
					name: template.name + ' (' + orientation + ')',
					description: template.description,
					content: json,
					image: await renderImage(json, width, height)
				});
				setPlaceholderSrc(json.objects);
			}
		}
		return result;
	}

	generate()
		.then(result => document.getElementById('out').textContent = JSON.stringify(result))
		.catch(error => document.getElementById('out').textContent = 'ERROR ' + error.stack)
		.finally(() => document.title = 'done');
</script>
</body>
</html>
