name: tests

# Fast checks run in parallel on every push and pull request. Each job has one task, so the
# failing one tells what is wrong: static analysis, unit tests, integration tests with a real
# database, the unit tests of the JavaScript, the security checks. Coverage is measured on its own.
# The browser tests (Panther) are not part of it.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static analysis and architecture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-app

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Architecture (layers, groups of the tests)
        run: vendor/bin/phpunit --testsuite architecture

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-app

      - name: PHPUnit unit
        run: vendor/bin/phpunit --testsuite unit

  integration:
    name: integration tests (real database)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-app

      - name: PHPUnit integration
        run: vendor/bin/phpunit --testsuite integration

  blackbox:
    name: blackbox tests (real server over HTTP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-app

      - name: PHPUnit blackbox
        run: vendor/bin/phpunit --testsuite blackbox

  javascript:
    name: javascript unit tests (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno test
        working-directory: tests/Js
        run: deno test

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-app
        with:
          coverage: pcov

      - name: PHPUnit with coverage
        run: |
          mkdir -p coverage
          vendor/bin/phpunit --coverage-text --coverage-clover=coverage/clover.xml | tee coverage/coverage.txt

      - name: Show the numbers on the summary page
        if: always()
        run: |
          {
            echo '### Coverage'
            echo '```'
            grep -E '^ +(Classes|Methods|Lines):' coverage/coverage.txt | head -3
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/clover.xml

  security:
    name: security checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the secret scan reads the whole history

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Known vulnerabilities in the packages
        run: composer audit --locked --no-interaction

      - name: Secrets in the code and the history
        run: |
          docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.30.1 \
            git /repo --no-banner --redact -c /repo/.gitleaks.toml

  # The coverage badge of the README. It lives in the branch "badges" next to the badge of
  # mutation.yml; the script keeps the other badges and replaces the branch with one new commit,
  # so there is nothing to maintain. It runs only on main, never with the code of a pull request,
  # because it may write.
  badge:
    name: coverage badge
    needs: coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-app

      - name: Load the coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage

      - name: Make the badge and publish it in the branch "badges"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/badge"
          vendor/bin/coverage-badge coverage/clover.xml "$RUNNER_TEMP/badge/coverage.svg" coverage
          .github/scripts/publish-badge.sh "$RUNNER_TEMP/badge/coverage.svg"
