name: docker-hub image

# Built for every published release, by hand under Actions for the selected branch.
# The SBOM garlic-hub.cdx.json (bin/create-sbom.sh: composer packages and the libraries in public/) is made
# once: attached to the release and copied into the image (/var/www, outside the document root), where the
# SBOM of BuildKit (OS packages) finds it. The image gets the SBOM and the provenance as attestations.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # attach the SBOM to the release

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Determine version
      id: version
      run: echo "version=$(head -n1 VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: curl, fileinfo, imagick, intl, mbstring, openssl, simplexml, zip
        tools: composer:v2

    - name: SBOM
      env:
        COMPOSER_ROOT_VERSION: ${{ steps.version.outputs.version }}
      run: |
        composer install --no-interaction --no-progress --prefer-dist --no-scripts
        bash bin/create-sbom.sh
        rm -rf vendor # with the dev packages, COPY . in the Dockerfile would overwrite the vendor of the image

    - name: Attach the SBOM to the release
      if: github.event_name == 'release'
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "${{ github.event.release.tag_name }}" garlic-hub.cdx.json --clobber

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to DockerHub
      uses: docker/login-action@v4
      with:
        username: sagiadinos
        password: ${{ secrets.SAGIADINOS }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        sbom: true
        provenance: mode=max
        tags: |
          sagiadinos/garlic-hub:latest
          sagiadinos/garlic-hub:${{ steps.version.outputs.version }}
