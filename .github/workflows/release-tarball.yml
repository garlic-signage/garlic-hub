name: release tarball

# garlic-hub ready to run: the code of the tag without the development files (as .dockerignore and the Pi image)
# and vendor/ without the dev packages. garlic-hub-update on the Pi installs it from
# https://github.com/garlic-signage/garlic-hub/releases/latest/download/garlic-hub.tar.gz, therefore the same
# name in every release, with garlic-hub.tar.gz.sha256 beside it.
# Built for every published release and attached to it. By hand under Actions for a tag or a branch: with a
# release of that name it is attached there, otherwise it is kept as an artifact of the run.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag or branch, e.g. v1.3.0 or main
        required: true

permissions:
  contents: write

concurrency:
  group: release-tarball-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  tarball:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, fileinfo, imagick, intl, mbstring, openssl, simplexml, zip
          tools: composer:v2

      - name: Build
        run: |
          APP="$RUNNER_TEMP/app"
          mkdir -p "$APP" "$RUNNER_TEMP/out"
          git archive HEAD | tar -x -C "$APP"
          rm -rf "$APP"/{.ddev,.github,tests,misc}
          composer install --working-dir="$APP" --no-dev --no-interaction --no-progress --prefer-dist --classmap-authoritative
          tar -czf "$RUNNER_TEMP/out/garlic-hub.tar.gz" --owner=0 --group=0 --sort=name -C "$APP" .
          (cd "$RUNNER_TEMP/out" && sha256sum garlic-hub.tar.gz > garlic-hub.tar.gz.sha256)
          tar -xzOf "$RUNNER_TEMP/out/garlic-hub.tar.gz" ./VERSION
          ls -lh "$RUNNER_TEMP/out"

      - name: Attach it to the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP"/out/* --clobber
          else
            echo "no release $TAG" && echo "missing=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep it as an artifact
        if: steps.release.outputs.missing == '1'
        uses: actions/upload-artifact@v7
        with:
          name: garlic-hub-tarball
          path: ${{ runner.temp }}/out/
