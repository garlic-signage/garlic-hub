
playlists_server_url = ""
path_playlists = "var/smil/playlists/"

[Defaults]
duration            =  10
volume              = 100
transition          =   1
fit		            =   3 ; meetbest
media_align         = "center"

[TwoFactor]
required            = 0  ; every user needs the second factor to work, effective at once

[Sso]
enabled             = 0  ; login with OpenID Connect (Google, Entra ID, Okta, Keycloak ...)
name                = "" ; on the button of the login page: "Log in with ..."
issuer              = "" ; the address of the provider, see docs/user-administration.md
client_id           = ""
client_secret       = "" ; stored encrypted
allowed_domains     = "" ; e.g. "example.com, example.org", empty: everybody the provider lets in

[GlobalACLs]
subadmin		= 1	 ; can do everything in his company / reseller
moduleadmin		= 2  ; can do everything

[VipNames]
subadmin		= "users_subadmin"
moduleadmin		= "users_moduleadmin"
