allowed_tags = "<p><a><h1><h2><h3><br><h4><strong><em><u><section><article><header><footer></footer></header></article></section><img><div><table><thead><tbody><tfooter><tr><td><ol><ul><li><iframe>"
password_pattern = "(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"

[Proxy]
; the reverse proxies whose X-Forwarded-For counts, addresses or networks separated by commas: the address of the
; visitor comes from it for the login limits and the logs. Empty trusts nobody: without a proxy a user could give
; another address in the header. Behind a proxy add its address or network, e.g. 127.0.0.1 for nginx on the same
; host, 172.16.0.0/12 for Docker or the networks of Cloudflare; public networks larger than /8 (IPv6 /16) are ignored.
; A change belongs in var/settings/config_main.ini (section Proxy): an update replaces this file.
trusted_proxies = ""
