; the settings of the whole installation. Everything which costs resources is off by default:
; an admin enables it on the settings page, the changes are in var/settings/config_system.ini
[Scheduler]
enabled			= 0  ; the cron starts it every 5 minutes, without this switch it ends at once

[Audit]
enabled			= 0
retention_days	= 365

[GlobalACLs]
moduleadmin		= 8  ; can change the settings

