ServerName _

<VirtualHost *:80>
    ServerAdmin garlic@saghiadinos.de
    DocumentRoot "/var/www/public"
    <Directory "/var/www/public/">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

 #   Alias /device-logs /var/www/var/devicelogs
 #   <Directory "/var/www/var/devicelogs">
 #       DAV On
 #       Options None
 #       AllowOverride None
        # maximun 20MB
 #       LimitRequestBody 20971520

 #       <RequireAll>
 #           Require method PUT
 #           Require expr "%{REQUEST_URI} =~ m#^(/[A-Za-z0-9_.-]+)+\.xml$#i"
 #       </RequireAll>
 #   </Directory>

    # delivery.php hands player downloads to Apache instead of streaming them through PHP
    <IfModule mod_xsendfile.c>
        XSendFile On
        XSendFilePath /var/www/var/storage/mediapool/originals
        XSendFilePath /var/www/var/storage/playlists/items/originals
        SetEnv GARLIC_XSENDFILE 1
    </IfModule>

    # the browser asks for the scripts and styles every time (a 304 while they are unchanged): after an update
    # it runs the new code, not a version it keeps for days because the file was unchanged for a long time
    <FilesMatch "\.(js|css)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>

    ErrorLog /var/www/var/weblogs/error.log
    CustomLog /var/www/var/weblogs/access.log combined
</VirtualHost>
